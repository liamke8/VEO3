<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Video Ideation</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <header>
        <h1>AI Video Ideation</h1>
        <nav>
            <a href="{{ url_for('index') }}">Home</a> |
            <a href="{{ url_for('dashboard') }}">Dashboard</a>
        </nav>
    </header>
    <main>
        <div class="container">
            <h2>Generate a New Video</h2>
            <p>Enter a prompt for the AI to generate a new video. Be as descriptive as possible!</p>
            <form action="{{ url_for('generate_video') }}" method="post">
                <div>
                    <label for="prompt">Video Prompt:</label>
                    <textarea id="prompt" name="prompt" rows="5" required></textarea>
                </div>
                <button type="submit">Generate Video</button>
            </form>
        </div>
    </main>
    <footer>
        <p>&copy; 2025 Your Company</p>
    </footer>
</body>
</html>
